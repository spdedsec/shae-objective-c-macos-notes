name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package release artifact
        run: |
          zip -r shae-objective-c-macos-notes-${{ github.ref_name }}.zip \
            src scripts Makefile README.md DESIGN.md LICENSE docs

      - name: Create GitHub release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            SHAE Notes v${{ github.ref_name }}

            macOS notes app in Objective-C (Foundation). Create/list/view/
            edit/delete notes with JSON persistence. See README.md.
          files: shae-objective-c-macos-notes-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
